<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BananaTone — Session Done Component Reference</title>
  <style>
    :root {
      --cream: #FFF8EA;
      --cream-2: #F5EEDC;
      --plum: #3E334F;
      --muted-plum: #6B6174;
      --soft-line: rgba(80, 75, 115, .13);
      --banana: #FFE29A;
      --gold: #D9B85F;
      --sage: #7E8B5E;
      --shadow: rgba(80, 75, 115, .16);
      --font: ui-rounded, "Nunito", "Baloo 2", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    [data-theme="dark"] {
      --cream: #26212F;
      --cream-2: #1F1B27;
      --plum: #FFF8EA;
      --muted-plum: #D9CFBE;
      --soft-line: rgba(255, 248, 234, .14);
      --banana: #E7C96F;
      --gold: #D9B85F;
      --sage: #96A26D;
      --shadow: rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 226, 148, .22), transparent 22rem),
        linear-gradient(180deg, var(--cream), var(--cream-2));
      font-family: var(--font);
      color: var(--plum);
      display: grid;
      place-items: start center;
      padding: 18px;
    }

    .demo-shell {
      width: min(1120px, calc(100vw - 36px));
    }

    .session-done-card {
      position: relative;
      width: 100%;
      min-height: calc(100vh - 132px);
      border-radius: clamp(34px, 5vw, 62px);
      border: 1.5px solid var(--soft-line);
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 226, 148, .26), transparent 18rem),
        radial-gradient(circle at 86% 86%, rgba(126, 139, 94, .14), transparent 19rem),
        linear-gradient(180deg, rgba(255, 248, 234, .92), rgba(255, 255, 255, .70));
      box-shadow:
        0 24px 66px var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, .72);
      overflow: hidden;
      text-align: center;
      padding: clamp(54px, 7vh, 92px) clamp(34px, 5.8vw, 76px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    [data-theme="dark"] .session-done-card {
      background:
        radial-gradient(circle at 16% 10%, rgba(217, 184, 95, .12), transparent 18rem),
        radial-gradient(circle at 86% 86%, rgba(126, 139, 94, .09), transparent 19rem),
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.045));
      box-shadow:
        0 24px 66px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .session-done-card::before,
    .session-done-card::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      z-index: 0;
    }

    .session-done-card::before {
      width: 230px;
      height: 230px;
      right: -96px;
      top: -108px;
      background: rgba(217, 184, 95, .15);
    }

    .session-done-card::after {
      width: 180px;
      height: 180px;
      left: -90px;
      bottom: -98px;
      background: rgba(126, 139, 94, .11);
    }

    .session-done-content {
      position: relative;
      z-index: 1;
      width: min(860px, 100%);
      margin: 0 auto;
    }

    .session-kicker {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(217, 184, 95, .28);
      background: rgba(217, 184, 95, .22);
      color: #735616;
      font-size: 12px;
      font-weight: 1000;
      letter-spacing: .045em;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.48);
    }

    [data-theme="dark"] .session-kicker {
      color: #FFE29A;
      background: rgba(217, 184, 95, .13);
    }

    .session-title {
      margin: clamp(16px, 2.2vh, 26px) 0 clamp(10px, 1.4vh, 16px);
      color: var(--plum);
      font-size: clamp(64px, 8.8vw, 112px);
      line-height: .82;
      letter-spacing: -.085em;
      font-weight: 1000;
    }

    .session-copy {
      max-width: 56ch;
      margin: 0 auto;
      color: var(--muted-plum);
      font-size: clamp(17px, 2vw, 22px);
      font-weight: 800;
      line-height: 1.38;
    }

    .session-stats {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(0, .9fr) minmax(280px, 1.2fr);
      gap: 14px;
      width: min(880px, 100%);
      margin: clamp(34px, 5vh, 58px) auto 0;
      align-items: stretch;
    }

    .stat-card {
      min-height: clamp(112px, 14vh, 152px);
      border-radius: 30px;
      border: 1px solid rgba(80, 75, 115, .10);
      background: rgba(255,255,255,.50);
      box-shadow: 0 3px 0 rgba(80, 75, 115, .07);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 18px;
      overflow: hidden;
    }

    [data-theme="dark"] .stat-card {
      background: rgba(255,255,255,.06);
      border-color: rgba(255, 248, 234, .12);
      box-shadow: 0 3px 0 rgba(0,0,0,.22);
    }

    .stat-value {
      color: var(--plum);
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -.055em;
    }

    .stat-label {
      margin-top: 9px;
      color: #7A7082;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .045em;
      text-transform: uppercase;
    }

    [data-theme="dark"] .stat-label { color: #CDBFAE; }

    .weak-stat {
      gap: 12px;
    }

    .weak-area-chips {
      order: 1;
      display: flex;
      width: 100%;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      text-align: center;
    }

    .weak-area-empty {
      display: block;
      width: 100%;
      max-width: 100%;
      color: var(--plum);
      font-size: clamp(34px, 3.45vw, 52px);
      line-height: .98;
      font-weight: 1000;
      letter-spacing: -.075em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .weak-area-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid rgba(80, 75, 115, .12);
      background: rgba(255, 248, 234, .78);
      color: var(--plum);
      font-size: 15px;
      font-weight: 1000;
      line-height: 1;
      box-shadow: 0 2px 0 rgba(80, 75, 115, .07);
      white-space: nowrap;
    }

    [data-theme="dark"] .weak-area-chip {
      background: rgba(255,255,255,.07);
      border-color: rgba(255,248,234,.13);
      color: #E6DBC8;
    }

    .weak-area-chip.more {
      background: rgba(217, 184, 95, .18);
      color: #735616;
      border-color: rgba(217, 184, 95, .24);
    }

    .weak-label {
      order: 2;
      display: block;
      width: 100%;
      color: #7A7082;
      font-size: 12px;
      line-height: 1.05;
      font-weight: 950;
      letter-spacing: .045em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }

    [data-theme="dark"] .weak-label { color: #CDBFAE; }

    .session-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: clamp(34px, 5vh, 58px) auto 0;
      max-width: 680px;
    }

    .session-actions button {
      min-height: 52px;
      min-width: 156px;
      padding: 0 24px;
      border-radius: 999px;
      border: 1.5px solid rgba(80, 75, 115, .12);
      font-family: inherit;
      font-size: 14px;
      font-weight: 950;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .session-actions button:hover { transform: translateY(-2px); }

    .primary {
      min-width: 180px !important;
      background: var(--banana);
      color: #3E334F;
      border-color: rgba(217, 184, 95, .34) !important;
      box-shadow: 0 5px 0 rgba(80, 75, 115, .16);
    }

    .secondary {
      background: rgba(255,255,255,.66);
      color: #554B65;
      box-shadow: 0 4px 0 rgba(80, 75, 115, .10);
    }

    .ghost {
      background: transparent;
      color: var(--muted-plum);
      box-shadow: none;
      opacity: .88;
    }

    [data-theme="dark"] .secondary {
      background: rgba(255,255,255,.07);
      color: #E6DBC8;
      border-color: rgba(255,248,234,.13);
    }

    .confetti {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      border-radius: inherit;
    }

    .confetti i {
      position: absolute;
      width: 7px;
      height: 11px;
      border-radius: 3px;
      opacity: 0;
      animation: fall 1.18s cubic-bezier(.18, .84, .28, 1) forwards;
    }

    @keyframes fall {
      0% { opacity: 0; transform: translateY(-36px) rotate(0deg) scale(.72); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translateY(188px) rotate(240deg) scale(1); }
    }

    .theme-toggle {
      position: fixed;
      right: 16px;
      bottom: 16px;
      border: 1px solid var(--soft-line);
      border-radius: 999px;
      background: rgba(255,255,255,.62);
      color: var(--plum);
      min-height: 40px;
      padding: 0 14px;
      font-weight: 900;
      cursor: pointer;
    }

    [data-theme="dark"] .theme-toggle { background: rgba(255,255,255,.08); }

    @media (max-height: 820px) and (min-width: 701px) {
      .session-done-card {
        min-height: calc(100vh - 116px);
        padding-top: 42px;
        padding-bottom: 42px;
      }

      .session-title { font-size: clamp(54px, 7.4vw, 88px); }
      .session-copy { font-size: 17px; }
      .session-stats { margin-top: 26px; }
      .stat-card { min-height: 96px; }
      .session-actions { margin-top: 26px; }
      .weak-area-empty { font-size: clamp(30px, 3vw, 44px); }
    }

    @media (max-width: 900px) and (min-width: 701px) {
      .session-stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        max-width: 760px;
      }

      .weak-area-empty { font-size: clamp(26px, 3vw, 36px); }
    }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .demo-shell { width: calc(100vw - 24px); }

      .session-done-card {
        min-height: calc(100vh - 104px);
        border-radius: 34px;
        padding: 34px 16px 28px;
      }

      .session-title { font-size: clamp(48px, 14vw, 72px); }
      .session-copy { font-size: 15px; }

      .session-stats {
        grid-template-columns: 1fr;
        gap: 8px;
        margin-top: 24px;
      }

      .stat-card {
        min-height: 66px;
        flex-direction: row;
        justify-content: space-between;
        padding: 12px 14px;
      }

      .weak-stat {
        min-height: 92px;
        flex-direction: column;
        justify-content: center;
      }

      .weak-area-empty {
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        font-size: 28px;
        line-height: 1.05;
      }

      .session-actions {
        margin-top: 24px;
      }

      .session-actions button {
        flex: 1 1 100%;
        min-width: 0 !important;
        min-height: 44px;
      }
    }
  </style>
  <!-- Structured Data for Site Name -->
  <script type="application/ld+json">
  {
    "@context" : "https://schema.org",
    "@type" : "WebSite",
    "name" : "BananaTone",
    "url" : "https://bananatone.com/"
  }
  </script>
  <meta property="og:site_name" content="BananaTone" />
</head>
<body>
  <main class="demo-shell">
    <section class="session-done-card" aria-live="polite">
      <div class="confetti" id="confetti" aria-hidden="true"></div>
      <div class="session-done-content">
        <div class="session-kicker">Practice round complete</div>
        <h1 class="session-title">Session done</h1>
        <p class="session-copy">Nice work — your ear got a little sharper.</p>

        <div class="session-stats">
          <div class="stat-card">
            <strong class="stat-value">10/10</strong>
            <span class="stat-label">Completed</span>
          </div>

          <div class="stat-card">
            <strong class="stat-value">90%</strong>
            <span class="stat-label">Accuracy</span>
          </div>

          <div class="stat-card weak-stat">
            <div class="weak-area-chips" id="weakAreaChips" aria-label="Weak areas">
              <span class="weak-area-empty">No major weak area</span>
            </div>
            <span class="weak-label">Weak areas</span>
          </div>
        </div>

        <div class="session-actions">
          <button class="primary">Next session</button>
          <button class="secondary">Change settings</button>
          <button class="ghost">End session</button>
        </div>
      </div>
    </section>
  </main>

  <button class="theme-toggle" type="button" onclick="toggleTheme()">Toggle theme</button>

  <script>
    function renderWeakAreas(areas) {
      const wrap = document.getElementById("weakAreaChips");
      wrap.innerHTML = "";

      if (!areas || !areas.length) {
        const empty = document.createElement("span");
        empty.className = "weak-area-empty";
        empty.textContent = "No major weak area";
        wrap.appendChild(empty);
        return;
      }

      const maxVisible = 3;
      areas.slice(0, maxVisible).forEach((label) => {
        const chip = document.createElement("span");
        chip.className = "weak-area-chip";
        chip.textContent = label;
        wrap.appendChild(chip);
      });

      if (areas.length > maxVisible) {
        const more = document.createElement("span");
        more.className = "weak-area-chip more";
        more.textContent = `+${areas.length - maxVisible} more`;
        wrap.appendChild(more);
      }
    }

    function launchConfetti() {
      const wrap = document.getElementById("confetti");
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const colors = ["#D9B85F", "#7E8B5E", "#E9A66B", "#3E334F", "#FFF8EA"];
      wrap.innerHTML = "";
      for (let i = 0; i < 26; i++) {
        const piece = document.createElement("i");
        piece.style.left = `${8 + Math.random() * 84}%`;
        piece.style.top = `${-10 - Math.random() * 22}px`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * .26}s`;
        piece.style.animationDuration = `${0.9 + Math.random() * .45}s`;
        piece.style.width = `${5 + Math.random() * 5}px`;
        piece.style.height = `${8 + Math.random() * 9}px`;
        wrap.appendChild(piece);
      }
      setTimeout(() => { wrap.innerHTML = ""; }, 1600);
    }

    function toggleTheme() {
      const root = document.documentElement;
      root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    }

    renderWeakAreas([]); // Example: renderWeakAreas(["G", "Minor", "Perfect 5th", "A"]);
    launchConfetti();
  </script>
</body>
</html>
